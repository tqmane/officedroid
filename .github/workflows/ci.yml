name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S runtime -B .build/native -G Ninja && cmake --build .build/native && ctest --test-dir .build/native --output-on-failure
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .tools
          key: android-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'scripts/env.sh') }}
      - run: ./scripts/setup.sh --emulator
      - run: ./scripts/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - run: ./scripts/emulator-test.sh
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/outputs/androidTest-results/
            .build/emulator/
