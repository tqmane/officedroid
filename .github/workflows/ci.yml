name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S runtime -B .build/native -G Ninja && cmake --build .build/native && ctest --test-dir .build/native --output-on-failure
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: .tools
          key: android-${{ runner.os }}-${{ hashFiles('scripts/setup.sh', 'scripts/env.sh') }}
      - run: ./scripts/setup.sh --emulator
      - run: ./scripts/build.sh
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo 'KVM is unavailable on this runner; testing with bounded software emulation.'
          fi
      - run: ./scripts/emulator-test.sh
        timeout-minutes: 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results
          include-hidden-files: true
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/outputs/androidTest-results/
            .build/emulator/
