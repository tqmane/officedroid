name: Wine Android
on:
  workflow_dispatch:
    inputs:
      office_install_timeout_seconds:
        description: 'ODT time limit (shorter runs are useful when diagnosing a startup hang)'
        default: '1800'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'app/**'
      - 'runtime/**'
      - 'tests/**'
      - '*.gradle'
      - '.github/workflows/wine.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'app/**'
      - 'runtime/**'
      - 'tests/**'
      - '*.gradle'
      - '.github/workflows/wine.yml'
permissions:
  contents: read
concurrency:
  group: wine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wine:
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/setup.sh --wine
      - uses: actions/cache/restore@v4
        id: wine-cache
        with:
          path: .build
          key: wine-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('scripts/build-wine.sh', 'scripts/build-tls.sh', 'scripts/setup.sh', 'scripts/env.sh') }}-${{ hashFiles('patches/wine/**') }}
          restore-keys: |
            wine-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('scripts/build-wine.sh', 'scripts/build-tls.sh', 'scripts/setup.sh', 'scripts/env.sh') }}-
            wine-${{ runner.os }}-${{ matrix.abi }}-
      - name: Build Wine and preserve the real exit code
        shell: bash
        run: |
          mkdir -p .build/logs
          set -o pipefail
          ./scripts/build-wine.sh '${{ matrix.abi }}' 2>&1 | tee '.build/logs/wine-${{ matrix.abi }}.log'
      - uses: actions/cache/save@v4
        if: steps.wine-cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.wine-cache.outputs.cache-primary-key }}
      - name: Package APK and corresponding Wine source
        run: |
          python3 scripts/package-wine.py '${{ matrix.abi }}'
          ./scripts/build.sh -PwineRuntime=true
          git -C .tools/src/wine archive --format=tar.gz --output="$PWD/.build/wine-11.0-source.tar.gz" HEAD
          git -C .tools/src/freetype archive --format=tar.gz --output="$PWD/.build/freetype-2.13.3-source.tar.gz" HEAD
          git archive --format=tar.gz --output=.build/officedroid-build-source.tar.gz HEAD
          cp .tools/downloads/gmp-6.3.0.tar.xz .build/gmp-6.3.0-source.tar.xz
          cp .tools/downloads/nettle-3.10.2.tar.gz .build/nettle-3.10.2-source.tar.gz
          cp .tools/downloads/gnutls-3.8.13.tar.xz .build/gnutls-3.8.13-source.tar.xz
      - name: Install emulator components
        if: matrix.abi == 'x86_64'
        run: ./scripts/setup.sh --emulator
      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo 'KVM is unavailable on this runner; testing with bounded software emulation.'
          fi
      - name: Verify Wine networking and Win32 editing on Android 16
        if: matrix.abi == 'x86_64'
        timeout-minutes: 35
        env:
          OFFICEDROID_KEEP_EMULATOR: '1'
        run: ./scripts/emulator-test.sh -PwineRuntime=true
      - name: Upload runtime verification before Office installation
        if: always() && matrix.abi == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: wine-android-runtime-checks
          include-hidden-files: true
          path: |
            .build/emulator/gui/
            .build/emulator/gui-wow64/
            .build/emulator/launch/
            app/build/outputs/androidTest-results/
      - name: Install official Microsoft 365 on Android
        if: matrix.abi == 'x86_64'
        timeout-minutes: 35
        env:
          OFFICE_INSTALL_TIMEOUT_SECONDS: ${{ inputs.office_install_timeout_seconds || '1800' }}
        run: |
          source scripts/env.sh
          export ANDROID_SERIAL=emulator-5554
          python3 scripts/office-install-test.py --timeout-seconds "$OFFICE_INSTALL_TIMEOUT_SECONDS"
      - name: Verify Word, Excel and PowerPoint editing, saving and cold reopening
        if: matrix.abi == 'x86_64'
        timeout-minutes: 20
        run: |
          source scripts/env.sh
          export ANDROID_SERIAL=emulator-5554
          python3 scripts/office-edit-test.py
      - name: Collect Android diagnostics and stop the emulator
        if: always() && matrix.abi == 'x86_64' && env.OFFICEDROID_EMULATOR_PID != ''
        run: ./scripts/emulator-stop.sh "$OFFICEDROID_EMULATOR_PID" "$OFFICEDROID_LOGCAT_PID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-${{ matrix.abi }}-results
          include-hidden-files: true
          path: |
            .build/logs/
            .build/wine-*/config.log
            .build/*source.tar.*
            .build/emulator/
            app/build/outputs/apk/
            app/build/reports/
            app/build/outputs/androidTest-results/
