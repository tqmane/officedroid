name: Wine Android
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'app/**'
      - 'runtime/**'
      - '*.gradle'
      - '.github/workflows/wine.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'patches/**'
      - 'app/**'
      - 'runtime/**'
      - '*.gradle'
      - '.github/workflows/wine.yml'
permissions:
  contents: read
concurrency:
  group: wine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wine:
    strategy:
      fail-fast: false
      matrix:
        abi: [x86_64, arm64-v8a]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./scripts/setup.sh --wine
      - uses: actions/cache/restore@v4
        id: wine-cache
        with:
          path: .build
          key: wine-${{ runner.os }}-${{ matrix.abi }}-${{ hashFiles('scripts/build-wine.sh', 'scripts/setup.sh', 'scripts/env.sh', 'patches/wine/**') }}
      - name: Build Wine and preserve the real exit code
        shell: bash
        run: |
          mkdir -p .build/logs
          set -o pipefail
          ./scripts/build-wine.sh '${{ matrix.abi }}' 2>&1 | tee '.build/logs/wine-${{ matrix.abi }}.log'
      - uses: actions/cache/save@v4
        if: steps.wine-cache.outputs.cache-hit != 'true'
        with:
          path: .build
          key: ${{ steps.wine-cache.outputs.cache-primary-key }}
      - name: Package APK and corresponding Wine source
        run: |
          python3 scripts/package-wine.py '${{ matrix.abi }}'
          ./scripts/build.sh -PwineRuntime=true
          git -C .tools/src/wine archive --format=tar.gz --output="$PWD/.build/wine-11.0-source.tar.gz" HEAD
          git -C .tools/src/freetype archive --format=tar.gz --output="$PWD/.build/freetype-2.13.3-source.tar.gz" HEAD
          git archive --format=tar.gz --output=.build/officedroid-build-source.tar.gz HEAD
      - name: Install emulator components
        if: matrix.abi == 'x86_64'
        run: ./scripts/setup.sh --emulator
      - name: Enable KVM
        if: matrix.abi == 'x86_64'
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm
          else
            echo 'KVM is unavailable on this runner; testing with bounded software emulation.'
          fi
      - name: Run Wine on Android 16
        if: matrix.abi == 'x86_64'
        timeout-minutes: 40
        run: ./scripts/emulator-test.sh -PwineRuntime=true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wine-${{ matrix.abi }}-results
          path: |
            .build/logs/
            .build/wine-*/config.log
            .build/*source.tar.gz
            .build/emulator/
            app/build/outputs/apk/
            app/build/reports/
            app/build/outputs/androidTest-results/
