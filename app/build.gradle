plugins { id 'com.android.application' }
def withWine = providers.gradleProperty('wineRuntime').orElse('false').get().toBoolean()
android {
    namespace 'org.officedroid'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'org.officedroid'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '0.1.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'x86_64', 'arm64-v8a' }
    }
    sourceSets.main {
        jniLibs.srcDirs = ['../.build/jniLibs']
        if (withWine) {
            jniLibs.srcDirs += ['../.build/wine-jniLibs']
            assets.srcDirs = ['../.build/wine-assets']
        }
    }
    packaging.jniLibs {
        useLegacyPackaging = true
        keepDebugSymbols += ['**/*.so']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
